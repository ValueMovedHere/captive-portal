<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>网络认证 · 安全接入</title>
    <style>
        /* ===== Reset ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ===== GitHub Primer 风格设计令牌 ===== */
        :root {
            /* 浅色（默认）— GitHub light high-contrast 灵感 */
            --bg: #ffffff;
            --bg-subtle: #f6f8fa;
            --card-bg: #ffffff;
            --card-border: #d0d7de;
            --card-shadow: 0 1px 0 rgba(31,35,40,0.04), 0 8px 24px rgba(31,35,40,0.08);
            --text-primary: #1f2328;
            --text-secondary: #59636e;
            --text-placeholder: #8c959f;
            --label-color: #1f2328;
            --input-bg: #ffffff;
            --input-border: #d0d7de;
            --input-border-focus: #0969da;
            --input-shadow-focus: 0 0 0 3px rgba(9,105,218,0.3);
            --input-shadow-rest: 0 0 0 1px rgba(255,255,255,0.6) inset;
            --btn-bg: #1f2328;
            --btn-bg-hover: #32383f;
            --btn-shadow: none;
            --link-color: #0969da;
            --link-hover: #0860c7;
            --checkbox-border: #8c959f;
            --checkbox-checked-bg: #0969da;
            --checkbox-checked-border: #0969da;
            --icon-color: #1f2328;
            --divider-color: #d0d7de;
            --toggle-bg: #f6f8fa;
            --toggle-hover: #eaeef2;
            --footer-text: #59636e;
            --error-color: #cf222e;
            --success-color: #1a7f37;
            --accent: #0969da;
            /* GitHub 风格：输入框/按钮均为锐利直角（square），仅卡片保留轻微圆角 */
            --radius: 0px;
            --radius-card: 12px;
            --btn-border: #1f2328;
            --btn-border-hover: #32383f;
            --transition-speed: 0.2s;
        }

        [data-theme="dark"] {
            /* 深色 — GitHub dark dim / dark high-contrast 灵感 */
            --bg: #0d1117;
            --bg-subtle: #010409;
            --card-bg: #161b22;
            --card-border: #30363d;
            --card-shadow: 0 0 0 1px #30363d, 0 8px 24px rgba(0,0,0,0.4);
            --text-primary: #e6edf3;
            --text-secondary: #9198a1;
            --text-placeholder: #6e7681;
            --label-color: #e6edf3;
            --input-bg: #0d1117;
            --input-border: #30363d;
            --input-border-focus: #2f81f7;
            --input-shadow-focus: 0 0 0 3px rgba(47,129,247,0.4);
            --input-shadow-rest: 0 0 0 1px rgba(48,54,61,0.5) inset;
            --btn-bg: #238636;
            --btn-bg-hover: #2ea043;
            --btn-shadow: none;
            --link-color: #2f81f7;
            --link-hover: #58a6ff;
            --checkbox-border: #6e7681;
            --checkbox-checked-bg: #238636;
            --checkbox-checked-border: #238636;
            --icon-color: #e6edf3;
            --divider-color: #30363d;
            --toggle-bg: #21262d;
            --toggle-hover: #30363d;
            --footer-text: #6e7681;
            --error-color: #f85149;
            --success-color: #3fb950;
            --accent: #2f81f7;
            --radius: 0px;
            --radius-card: 12px;
            --btn-border: #2ea043;
            --btn-border-hover: #3fb950;
        }

        html { font-size: 16px; -webkit-text-size-adjust: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-subtle);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            transition: background var(--transition-speed) ease;
            line-height: 1.5;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 卡片 ===== */
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 400px;
            padding: 32px;
            position: relative;
            transition: background var(--transition-speed) ease,
                box-shadow var(--transition-speed) ease,
                border-color var(--transition-speed) ease;
            animation: cardFadeIn 0.4s ease-out;
        }

        @keyframes cardFadeIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 主题切换 ===== */
        .theme-toggle {
            position: absolute;
            top: 16px; right: 16px;
            background: var(--toggle-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
            padding: 0; line-height: 1; z-index: 5;
        }
        .theme-toggle:hover { background: var(--toggle-hover); color: var(--text-primary); }
        .theme-toggle:active { transform: scale(0.94); }
        .theme-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .theme-toggle .sun-icon { display: none; }
        .theme-toggle .moon-icon { display: block; }
        [data-theme="dark"] .theme-toggle .sun-icon { display: block; }
        [data-theme="dark"] .theme-toggle .moon-icon { display: none; }

        /* ===== 头部 ===== */
        .auth-header { text-align: center; margin-bottom: 24px; padding-right: 36px; }
        .auth-header .logo {
            display: inline-flex; align-items: center; justify-content: center;
            width: 44px; height: 44px; margin-bottom: 12px;
            border: 1px solid var(--card-border); border-radius: var(--radius);
            background: var(--bg-subtle); color: var(--text-primary);
            transition: border-color var(--transition-speed) ease, background var(--transition-speed) ease;
        }
        .auth-header .logo svg { width: 22px; height: 22px; fill: currentColor; }
        .auth-header h1 {
            font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em;
            color: var(--text-primary); margin: 0 0 4px 0;
            transition: color var(--transition-speed) ease;
        }
        .auth-header p {
            font-size: 0.85rem; color: var(--text-secondary); margin: 0;
            transition: color var(--transition-speed) ease;
        }

        /* ===== 表单 ===== */
        .auth-form { display: flex; flex-direction: column; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label {
            font-size: 0.82rem; font-weight: 500; color: var(--label-color);
            transition: color var(--transition-speed) ease;
        }
        .form-group label .required { color: var(--error-color); font-weight: 400; margin-left: 2px; }
        .form-group input {
            width: 100%; padding: 8px 12px; font-size: 0.92rem; font-family: inherit;
            color: var(--text-primary); background: var(--input-bg);
            border: 1px solid var(--input-border); border-radius: var(--radius);
            outline: none;
            box-shadow: var(--input-shadow-rest);
            transition: background var(--transition-speed) ease,
                border-color 0.15s ease, box-shadow 0.15s ease, color var(--transition-speed) ease;
            -webkit-appearance: none; appearance: none;
        }
        .form-group input::placeholder { color: var(--text-placeholder); }
        .form-group input:focus { border-color: var(--input-border-focus); box-shadow: var(--input-shadow-rest), var(--input-shadow-focus); }
        .form-group input:user-invalid { border-color: var(--error-color); }
        .form-group input:user-invalid:focus { box-shadow: 0 0 0 3px rgba(207,34,46,0.2); }

        /* ===== 复选框 ===== */
        .checkbox-group { display: flex; align-items: flex-start; gap: 8px; margin-top: 2px; }
        .checkbox-group input[type="checkbox"] {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; min-width: 18px;
            border: 1.5px solid var(--checkbox-border); border-radius: var(--radius);
            background: var(--input-bg); cursor: pointer; position: relative;
            transition: border-color 0.15s ease, background 0.15s ease;
            margin-top: 2px; flex-shrink: 0;
        }
        .checkbox-group input[type="checkbox"]:checked {
            background: var(--checkbox-checked-bg); border-color: var(--checkbox-checked-border);
        }
        .checkbox-group input[type="checkbox"]:checked::after {
            content: ''; position: absolute; left: 4px; top: 1px;
            width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .checkbox-group input[type="checkbox"]:focus-visible { box-shadow: var(--input-shadow-focus); }
        .checkbox-group label {
            font-size: 0.82rem; color: var(--text-secondary); cursor: pointer;
            user-select: none; line-height: 1.5; transition: color var(--transition-speed) ease;
        }
        .checkbox-group label a { color: var(--link-color); text-decoration: none; font-weight: 500; }
        .checkbox-group label a:hover { color: var(--link-hover); text-decoration: underline; }

        /* ===== 提交按钮 ===== */
        .submit-btn {
            width: 100%; padding: 9px 16px; font-size: 0.95rem; font-weight: 500;
            font-family: inherit; color: #fff; background: var(--btn-bg);
            border: 1px solid var(--btn-border, var(--card-border)); border-radius: var(--radius);
            cursor: pointer; transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
            margin-top: 4px; letter-spacing: 0;
        }
        .submit-btn:hover { background: var(--btn-bg-hover); border-color: var(--btn-border-hover, var(--text-secondary)); }
        .submit-btn:active { transform: translateY(1px); }
        .submit-btn:focus-visible { outline: 2px solid var(--input-border-focus); outline-offset: 2px; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ===== 底部 ===== */
        .auth-footer {
            text-align: center; margin-top: 20px; padding-top: 16px;
            border-top: 1px solid var(--divider-color);
            transition: border-color var(--transition-speed) ease;
        }
        .auth-footer p { font-size: 0.75rem; color: var(--footer-text); margin: 0; line-height: 1.6; }
        .auth-footer p a { color: var(--link-color); text-decoration: none; }
        .auth-footer p a:hover { color: var(--link-hover); text-decoration: underline; }

        /* ===== Toast ===== */
        .toast {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(60px);
            background: var(--card-bg); color: var(--text-primary);
            padding: 10px 16px; border-radius: var(--radius);
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            font-size: 0.85rem; font-weight: 500; opacity: 0;
            transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), opacity 0.3s ease;
            pointer-events: none; z-index: 999;
            max-width: 90vw; display: flex; align-items: center; gap: 8px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .toast .toast-icon { font-size: 1.05rem; flex-shrink: 0; }
        .toast.toast-error .toast-icon { color: var(--error-color); }
        .toast.toast-success .toast-icon { color: var(--success-color); }

        /* ===== 响应式 ===== */
        @media (max-width: 520px) {
            body { padding: 12px; }
            .auth-card { padding: 24px 20px; border-radius: var(--radius-card); }
            .auth-header h1 { font-size: 1.15rem; }
            .form-group input { padding: 8px 11px; font-size: 0.88rem; }
            .submit-btn { padding: 9px 14px; font-size: 0.92rem; }
            .theme-toggle { top: 12px; right: 12px; width: 32px; height: 32px; }
            .theme-toggle svg { width: 16px; height: 16px; }
            .checkbox-group label { font-size: 0.78rem; }
            .auth-footer p { font-size: 0.7rem; }
            .toast { font-size: 0.8rem; padding: 9px 14px; bottom: 16px; }
        }
        @media (max-width: 380px) {
            .auth-card { padding: 20px 16px; }
            .auth-header { margin-bottom: 18px; }
            .form-group input { padding: 7px 10px; font-size: 0.85rem; }
        }
        @media (max-height: 700px) and (orientation: landscape) {
            body { padding: 12px 20px; align-items: flex-start; padding-top: 16px; }
            .auth-card { padding: 20px 24px; max-width: 440px; }
            .auth-header { margin-bottom: 14px; }
            .auth-header h1 { font-size: 1.1rem; }
            .auth-header .logo { width: 36px; height: 36px; margin-bottom: 8px; }
            .auth-header .logo svg { width: 18px; height: 18px; }
            .auth-form { gap: 10px; }
            .form-group input { padding: 7px 10px; font-size: 0.85rem; }
            .submit-btn { padding: 8px 14px; font-size: 0.88rem; margin-top: 0; }
            .auth-footer { margin-top: 14px; padding-top: 12px; }
        }
        @media (min-width: 768px) {
            .auth-card { padding: 36px 40px; max-width: 420px; }
            .form-group input { padding: 9px 12px; font-size: 0.95rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
        :focus-visible { outline: 2px solid var(--input-border-focus); outline-offset: 2px; }
    </style>
</head>
<body>

    <div class="toast" id="toast" role="alert" aria-live="polite">
        <span class="toast-icon" id="toastIcon">✓</span>
        <span id="toastMessage"></span>
    </div>

    <div class="auth-card" role="main" aria-labelledby="authTitle">

        <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色模式" title="切换深色/浅色模式">
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>

        <div class="auth-header">
            <div class="logo" aria-hidden="true">
                <!-- 盾牌锁图标，契合"安全接入" -->
                <svg viewBox="0 0 24 24"><path d="M12 2L4 5v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V5l-8-3zm3 9h-2v3H9V9H7V7h2V5h2v2h2v2h2v2z"/></svg>
            </div>
            <h1 id="authTitle">安全网络接入</h1>
            <p>登录以连接互联网</p>
        </div>

        <form class="auth-form" id="authForm" action="/auth/login" method="POST" novalidate autocomplete="on">

            <div class="form-group">
                <label for="name">姓名 <span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="请输入您的姓名" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="phone">手机号 <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="请输入手机号" inputmode="numeric" pattern="[0-9+\-() ]{7,20}" required autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="student_id">账号（学号） <span class="required">*</span></label>
                <input type="text" id="student_id" name="student_id" placeholder="请输入您的学号" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">密码 <span class="required">*</span></label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="agree" name="agree" required value="true">
                <label for="agree">
                    我已阅读并同意 <a href="#" target="_blank" rel="noopener">隐私政策</a> 和 <a href="#" target="_blank" rel="noopener">服务条款</a>
                    <span style="color:var(--error-color)">*</span>
                </label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">连接网络</button>
        </form>

        <div class="auth-footer">
            <p>连接即表示您同意我们的服务条款和隐私政策。<br>&copy; 2026 安全网络服务</p>
        </div>
    </div>

<script>
    (function() {
        'use strict';

        // ---------- 1. 主题切换 ----------
        const html = document.documentElement;
        const toggleBtn = document.getElementById('themeToggle');
        const STORAGE_KEY = 'auth_theme';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        function getStoredTheme() {
            try { return localStorage.getItem(STORAGE_KEY); } catch (_) { return null; }
        }
        function setStoredTheme(theme) {
            try { localStorage.setItem(STORAGE_KEY, theme); } catch (_) {}
        }
        function applyTheme(theme) {
            if (theme === 'dark') html.setAttribute('data-theme', 'dark');
            else html.removeAttribute('data-theme');
            const isDark = theme === 'dark';
            toggleBtn.setAttribute('aria-label', isDark ? '切换到浅色模式' : '切换到深色模式');
            toggleBtn.setAttribute('title', isDark ? '切换到浅色模式' : '切换到深色模式');
        }
        function initTheme() {
            const stored = getStoredTheme();
            applyTheme(stored === 'dark' || stored === 'light' ? stored : (prefersDark.matches ? 'dark' : 'light'));
        }
        initTheme();
        toggleBtn.addEventListener('click', function() {
            const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme); setStoredTheme(newTheme);
        });
        prefersDark.addEventListener('change', function(e) {
            if (!getStoredTheme()) applyTheme(e.matches ? 'dark' : 'light');
        });

        // ---------- 2. Toast ----------
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');
        let toastTimer = null;
        function showToast(message, type, icon) {
            if (toastTimer) clearTimeout(toastTimer);
            toast.classList.remove('show', 'toast-error', 'toast-success');
            toastMessage.textContent = message;
            toastIcon.textContent = icon || '✓';
            if (type === 'error') toast.classList.add('toast-error');
            else if (type === 'success') toast.classList.add('toast-success');
            void toast.offsetWidth;
            toast.classList.add('show');
            toastTimer = setTimeout(() => { toast.classList.remove('show'); toastTimer = null; }, 3500);
        }
        function hideToast() { if (toastTimer) clearTimeout(toastTimer); toast.classList.remove('show'); }

        // ---------- 3. 表单校验 ----------
        const form = document.getElementById('authForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            hideToast();
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const student_id = document.getElementById('student_id').value.trim();
            const password = document.getElementById('password').value;
            const agree = document.getElementById('agree').checked;

            if (!name) { e.preventDefault(); showToast('请输入姓名', 'error', '✕'); document.getElementById('name').focus(); return; }
            if (!phone) { e.preventDefault(); showToast('请输入手机号', 'error', '✕'); document.getElementById('phone').focus(); return; }
            if (!student_id) { e.preventDefault(); showToast('请输入学号', 'error', '✕'); document.getElementById('student_id').focus(); return; }
            if (!password) { e.preventDefault(); showToast('请输入密码', 'error', '✕'); document.getElementById('password').focus(); return; }
            if (!agree) { e.preventDefault(); showToast('请阅读并同意隐私政策和服务条款', 'error', '✕'); document.getElementById('agree').focus(); return; }

            submitBtn.disabled = true;
            submitBtn.textContent = '提交中…';
            showToast('正在提交认证…', 'success', '✓');
        });

        setTimeout(function() {
            if (submitBtn.disabled) { submitBtn.disabled = false; submitBtn.textContent = '连接网络'; }
        }, 5000);

        // ---------- 4. 输入清洗 ----------
        document.getElementById('phone').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9+\-() ]/g, '');
        });
        document.getElementById('student_id').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
        const textInputs = form.querySelectorAll('input[type="text"], input[type="tel"]');
        textInputs.forEach(function(input) {
            input.addEventListener('blur', function() { this.value = this.value.trim(); });
        });

        // ---------- 5. agree 状态记忆 ----------
        const agreeCheckbox = document.getElementById('agree');
        try {
            if (sessionStorage.getItem('auth_agree') === 'true') agreeCheckbox.checked = true;
            agreeCheckbox.addEventListener('change', function() {
                try { sessionStorage.setItem('auth_agree', this.checked ? 'true' : 'false'); } catch (_) {}
            });
        } catch (_) {}

        // ---------- 6. URL 错误参数 ----------
        try {
            const err = new URLSearchParams(window.location.search).get('error');
            if (err) setTimeout(() => showToast(decodeURIComponent(err), 'error', '✕'), 300);
        } catch (_) {}

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && toast.classList.contains('show')) hideToast();
        });
    })();
</script>
</body>
</html>
